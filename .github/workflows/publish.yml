name: Publish

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "Optional npm dist-tag override (for example: beta)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify product packages
        run: |
          bun run typecheck:product
          bun run lint:product
          bun run check:public-api
          bun run check:package-boundaries
          bun run check:target-boundaries
          bun run check:docs-drift
          bun run test:product
          bun run test:agent-apply-gate
          bun run test:smoke
          bun run test:reference-apps

      - name: Labs/generated signal (non-blocking)
        continue-on-error: true
        run: |
          bun run typecheck:labs
          bun run scripts/typecheck.ts skills
          bun run lint:labs
          bunx oxlint packages/skills
          bun run test:generated
          bun run test:labs

      - name: Release performance gates
        run: |
          bunx playwright install chromium
          bun run perf:baseline:check
          bun run perf:ci
          bun run perf:expanded

      - name: Setup registry auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version packages
        run: |
          if [ -n "$NPM_DIST_TAG" ]; then
            bun run version:product -- --pre "$NPM_DIST_TAG"
          else
            bun run version:product
          fi
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}

      - name: Pre-publish check
        run: bun run check:product-release

      - name: Commit & push version changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages"
            git push
          fi

      - name: Publish to npm + GitHub Packages
        run: bun run publish:product
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
