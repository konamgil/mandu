name: smoke-cli

# Why this workflow exists:
#   The stable Mandu product is intentionally small: create, dev, build,
#   start, check, and agent. This job rehearses the first five minutes of
#   that product path so Labs/compatibility commands cannot silently become
#   release requirements again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  newbie-path:
    name: First-5-minutes CLI rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Smoke — global help works
        run: bun packages/cli/src/main.ts --help | grep -q "mandu"

      - name: Smoke — subcommand help (#269)
        run: |
          set -e
          CLI="bun packages/cli/src/main.ts"
          $CLI create --help | grep -q "create"
          $CLI dev --help | grep -q "dev"
          $CLI build --help | grep -q "build"
          $CLI start --help | grep -q "start"
          $CLI check --help | grep -q "check"
          $CLI agent --help | grep -q "context"
          $CLI agent --help | grep -q "plan"
          $CLI agent --help | grep -q "apply"
          $CLI agent --help | grep -q "verify"

      - name: Smoke — create a fresh project (#267 — must not emit tsconfig warnings)
        run: |
          set -e
          mkdir -p /tmp/mandu-smoke
          cd /tmp/mandu-smoke
          CLI="bun $GITHUB_WORKSPACE/packages/cli/src/main.ts"
          # --no-install keeps the test fast; --yes accepts every default.
          $CLI create demo --yes --no-install --minimal 2>./create.stderr
          test -d demo
          # #267/#272 — first stderr line should NOT be a tsconfig warning
          if grep -E "Invalid pattern|Non-relative path|baseUrl is not set" ./create.stderr; then
            echo "❌ tsconfig warning leaked through #267/#272 fix"
            cat ./create.stderr
            exit 1
          fi

      - name: Smoke — fresh project passes the stable safety check
        run: |
          set -e
          cd /tmp/mandu-smoke/demo
          CLI="bun $GITHUB_WORKSPACE/packages/cli/src/main.ts"
          $CLI check --json > check.json
          grep -q '"ok": true' check.json

      - name: Smoke — agent context is machine-readable
        run: |
          set -e
          cd /tmp/mandu-smoke/demo
          CLI="bun $GITHUB_WORKSPACE/packages/cli/src/main.ts"
          $CLI agent context --json --no-diagnose > agent-context.json
          grep -q '"framework": "mandu"' agent-context.json
          grep -q '"canonical"' agent-context.json

      - name: Smoke — agent plan is conservative and writable
        run: |
          set -e
          cd /tmp/mandu-smoke/demo
          CLI="bun $GITHUB_WORKSPACE/packages/cli/src/main.ts"
          $CLI agent plan "add a party page" --json --write > agent-plan.json
          test -f .mandu/agent-plan.json
          grep -q '"domains"' agent-plan.json
          grep -q '"executable": false' agent-plan.json

  npm-drift:
    name: npm registry drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pre-publish guard: catches local-vs-npm drift that previously bit us
    # (ate@1.0.0 / skills@1.0.0 in local package.json while npm sat at
    # 0.25.2 / 0.19.1). Soft-fail on PR so contributors aren't blocked,
    # hard-fail on main push so release prep can rely on it.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compare local vs npm
        run: bun run scripts/check-npm-drift.ts --product
